name: Apply Desktop V0.6.5 Patch

on:
  push:
    branches:
      - desktop-v0.6.5-progress-open
    paths:
      - ".github/workflows/patch-desktop-v065.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: desktop-v0.6.5-progress-open

      - name: Apply source patch
        run: python tools/patch_desktop_v065.py

      - name: Syntax check
        run: python -m py_compile main.py

      - name: Commit patched desktop source
        shell: bash
        run: |
          if git diff --quiet -- main.py; then
            echo "No main.py changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py
          git commit -m "Add desktop speed ETA and completed-folder action"
          git push origin HEAD:desktop-v0.6.5-progress-open
