name: Build Windows Installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Syntax check
        shell: pwsh
        run: python -m py_compile main.py

      - name: Download yt-dlp, Deno and FFmpeg
        shell: pwsh
        run: .\prepare_tools.ps1

      - name: Build Windows application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name YouTubeDownloader main.py
          Copy-Item tools\yt-dlp.exe dist\YouTubeDownloader\yt-dlp.exe
          Copy-Item tools\deno.exe dist\YouTubeDownloader\deno.exe
          Copy-Item tools\ffmpeg.exe dist\YouTubeDownloader\ffmpeg.exe
          Copy-Item tools\ffprobe.exe dist\YouTubeDownloader\ffprobe.exe
          Copy-Item THIRD_PARTY_NOTICES.md dist\YouTubeDownloader\THIRD_PARTY_NOTICES.md

      - name: Verify portable build contents
        shell: pwsh
        run: |
          $required = @(
            "YouTubeDownloader.exe",
            "yt-dlp.exe",
            "deno.exe",
            "ffmpeg.exe",
            "ffprobe.exe",
            "THIRD_PARTY_NOTICES.md"
          )
          foreach ($file in $required) {
            $path = Join-Path "dist\YouTubeDownloader" $file
            if (-not (Test-Path $path)) {
              throw "Missing packaged file: $path"
            }
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $pf86 = [Environment]::GetFolderPath("ProgramFilesX86")
          $iscc = Join-Path $pf86 "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = Join-Path $env:ProgramFiles "Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler was not found."
          }
          & $iscc installer.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeDownloader-Windows-Installer
          path: installer_output\YouTubeDownloader_Setup_v0.4.0.exe
          if-no-files-found: error
          compression-level: 0

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeDownloader-Windows-Portable
          path: dist\YouTubeDownloader\
          if-no-files-found: error
          compression-level: 0
